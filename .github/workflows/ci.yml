name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Browser integration tests drive the runner's preinstalled Google Chrome.
      ELOS_TEST_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allow Chrome's sandbox on Ubuntu 24.04
        # AppArmor blocks unprivileged user namespaces, which Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: google-chrome --version
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Limited parallelism: several test files start headless Chrome or MCP servers.
      - run: npm run test:ci
